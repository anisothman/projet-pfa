[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localis"
version = "0.2.0"
description = "Localis AI - business intelligence reports powered by Google + LLMs"
requires-python = ">=3.12"
authors = [
    { name = "Maram" },
    { name = "Anis" },
    { name = "Isra" },
    { name = "Hiba" },
    { name = "Tasnim" },
    { name = "Nourhene" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "google-search-results>=2.4.2",
    "google-genai>=0.8.0",
    "openai>=1.54",
    "reportlab>=4.2",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
